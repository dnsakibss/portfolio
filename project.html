<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Project | Nazmus Sakib Sami</title>
  <script>
    (function () {
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="256x256" href="favicon.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"></div>

  <header class="nav-wrap">
    <nav class="nav container" aria-label="Main">
      <a class="brand" href="index.html#home">NS<span>.</span></a>
      <div class="nav-links" id="nav-links">
        <a href="index.html#about">About</a>
        <a href="index.html#research">Research</a>
        <a href="index.html#projects" class="active">Projects</a>
        <a href="index.html#skills">Skills</a>
        <a href="index.html#education">Education</a>
        <a href="index.html#certificates">Certificates</a>
        <a href="index.html#contact">Contact</a>
      </div>
      <div class="nav-tools">
        <button class="icon-btn theme-toggle" type="button" aria-label="Switch colour theme" title="Switch theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <main class="container narrow pd" id="pd"></main>

  <footer>
    <div class="container footer-inner">
      <span>© <span id="year"></span> Nazmus Sakib</span>
      <span>Built with HTML, CSS & JavaScript</span>
    </div>
  </footer>

  <button class="to-top" type="button" aria-label="Back to top">↑</button>

  <script src="projects-data.js"></script>
  <script>
    // Build the page BEFORE script.js runs, so scroll-reveal picks up these elements
    (function () {
      const el = document.getElementById('pd');
      const id = new URLSearchParams(location.search).get('id');
      const i = PROJECTS.findIndex(p => p.id === id);
      const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
      if (i < 0) { el.innerHTML = '<a class="pd-back" href="index.html#projects">← All projects</a><h1>Project not found</h1>'; return; }
      const p = PROJECTS[i];
      const prev = PROJECTS[(i - 1 + PROJECTS.length) % PROJECTS.length];
      const next = PROJECTS[(i + 1) % PROJECTS.length];
      const base = 'assets/projects/' + p.id + '/';
      document.title = p.title + ' | Nazmus Sakib Sami';
      el.innerHTML =
        '<a class="pd-back" href="index.html#projects"><span>←</span> All projects</a>' +
        '<img class="pd-hero' + (p.fit === 'contain' ? ' contain' : '') + '" src="' + base + p.cover + '" alt="' + esc(p.title) + '" onerror="this.remove()">' +
        '<p class="project-type" style="margin-top:28px">' + esc(p.type) + '</p><h1>' + esc(p.title) + '</h1>' +
        '<div class="tags">' + p.tags.map(t => '<span>' + esc(t) + '</span>').join('') + '</div>' +
        '<h2>Overview</h2><p>' + esc(p.overview) + '</p>' +
        '<h2>Highlights</h2><ul class="pd-highlights">' + p.highlights.map(h => '<li>' + esc(h) + '</li>').join('') + '</ul>' +
        (p.gallery.length ? '<h2>Gallery</h2><div class="pd-gallery">' + p.gallery.map(g =>
          '<figure><img loading="lazy" tabindex="0" src="' + base + g.src + '" alt="' + esc(g.caption) + '" onerror="this.closest(\'figure\').remove()"><figcaption>' + esc(g.caption) + '</figcaption></figure>').join('') + '</div>' : '') +
        '<div class="pd-actions"><a class="btn primary magnetic" href="' + p.github + '" target="_blank" rel="noopener">View on GitHub ↗</a><a class="btn secondary magnetic" href="index.html#projects">All projects</a></div>' +
        '<nav class="pd-nav" aria-label="More projects">' +
          '<a href="?id=' + prev.id + '"><small>← PREVIOUS</small><strong>' + esc(prev.title) + '</strong></a>' +
          '<a class="next" href="?id=' + next.id + '"><small>NEXT →</small><strong>' + esc(next.title) + '</strong></a>' +
        '</nav>';
      document.addEventListener('keydown', e => {
        if (document.querySelector('.lightbox')) return;
        if (e.key === 'ArrowRight') location.search = '?id=' + next.id;
        if (e.key === 'ArrowLeft') location.search = '?id=' + prev.id;
      });
    })();
  </script>
  <script src="script.js"></script>
  <script>
    // Gallery images open in the lightbox, browsable with ← →
    (function () {
      const imgs = Array.from(document.querySelectorAll('.pd-gallery img'));
      const items = () => imgs.filter(im => im.isConnected).map(im => ({ src: im.src, alt: im.alt }));
      imgs.forEach(img => {
        const open = () => { const list = items(); openLightbox(list, list.findIndex(x => x.src === img.src)); };
        img.addEventListener('click', open);
        img.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
      });
    })();
  </script>
</body>
</html>
